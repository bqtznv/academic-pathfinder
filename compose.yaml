services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: academic-pathfinder-db
    environment:
      POSTGRES_DB: pathfinder
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-planner_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d pathfinder"]
      interval: 3s
      timeout: 3s
      retries: 20
